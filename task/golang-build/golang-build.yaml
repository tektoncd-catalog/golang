  labels:
    app.kubernetes.io/version: 1.3.0
spec:
  description: This Task is Golang task to build Go projects.
  params:
    - name: package
      description: base package to build in
    - name: packages
      description: 'packages to build (default: ./cmd/...)'
      default: ./cmd/...
    - name: version
      description: golang version to use for builds
      default: "1.26"
    - name: flags
      description: flags to use for the build command
      default: -v
    - name: GOOS
      description: running program's operating system target
      default: linux
    - name: GOARCH
      description: running program's architecture target
      default: amd64
    - name: GO111MODULE
      description: value of module support
      default: auto
    - name: GOCACHE
      description: Go caching directory path
      default: ""
    - name: GOMODCACHE
      description: Go mod caching directory path
      default: ""
    - name: CGO_ENABLED
      description: Toggle cgo tool during Go build. Use value '0' to disable cgo (for static builds).
      default: ""
    - name: GOSUMDB
      description: Go checksum database url. Use value 'off' to disable checksum validation.
      default: ""
  workspaces:
    - name: source
  steps:
    - name: build
      image: docker.io/library/golang:$(params.version)
      workingDir: $(workspaces.source.path)
      env:
        - name: GOOS
          value: $(params.GOOS)
        - name: GOARCH
          value: $(params.GOARCH)
        - name: GO111MODULE
          value: $(params.GO111MODULE)
        - name: GOCACHE
          value: $(params.GOCACHE)
        - name: GOMODCACHE
          value: $(params.GOMODCACHE)
        - name: CGO_ENABLED
          value: $(params.CGO_ENABLED)
        - name: GOSUMDB
          value: $(params.GOSUMDB)
        - name: PACKAGE
          value: $(params.package)
        - name: PACKAGES
          value: $(params.packages)
        - name: FLAGS
          value: $(params.flags)
      script: |
        if [ ! -e $GOPATH/src/${PACKAGE}/go.mod ];then
          SRC_PATH="$GOPATH/src/${PACKAGE}"
          mkdir -p $SRC_PATH
          cp -R "$(workspaces.source.path)"/* $SRC_PATH
          cd $SRC_PATH
        fi
        go build ${FLAGS} ${PACKAGES}
