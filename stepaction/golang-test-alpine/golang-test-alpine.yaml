spec:
  description: This StepAction is a Golang step to test Go projects. Uses the Alpine-based Go image for smaller footprint.
  params:
    - name: source-path
      description: Path to the Go source code to operate on.
      type: string
    - name: package
      description: package (and its children) under test
    - name: packages
      description: 'packages to test (default: ./...)'
      default: ./...
    - name: context
      description: path to the directory to use as context.
      default: "."
    - name: version
      description: golang version to use for tests
      default: "1.26"
    - name: flags
      description: flags to use for the test command
      default: -race -cover -v
    - name: GOOS
      description: running program's operating system target
      default: linux
    - name: GOARCH
      description: running program's architecture target
      default: amd64
    - name: GO111MODULE
      description: value of module support
      default: auto
    - name: GOCACHE
      description: Go caching directory path
      default: ""
    - name: GOMODCACHE
      description: Go mod caching directory path
      default: ""
  image: docker.io/library/golang:$(params.version)-alpine
  workingDir: $(params.source-path)
  env:
    - name: GOOS
      value: $(params.GOOS)
    - name: GOARCH
      value: $(params.GOARCH)
    - name: GO111MODULE
      value: $(params.GO111MODULE)
    - name: GOCACHE
      value: $(params.GOCACHE)
    - name: GOMODCACHE
      value: $(params.GOMODCACHE)
    - name: PACKAGE
      value: $(params.package)
    - name: PACKAGES
      value: $(params.packages)
    - name: FLAGS
      value: $(params.flags)
    - name: CONTEXT
      value: $(params.context)
    - name: SOURCE_PATH
      value: $(params.source-path)
  script: |
    if [ ! -e $GOPATH/src/${PACKAGE}/go.mod ];then
       SRC_PATH="$GOPATH/src/${PACKAGE}"
       mkdir -p $SRC_PATH
       cp -R "${SOURCE_PATH}/${CONTEXT}"/* $SRC_PATH
       cd $SRC_PATH
    fi
    go test ${FLAGS} ${PACKAGES}
