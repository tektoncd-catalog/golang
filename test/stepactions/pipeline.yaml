apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: golang-stepactions-pipeline
spec:
  workspaces:
    - name: shared-workspace
  params:
    - name: url
      description: Repository URL to clone from
    - name: revision
      description: Git revision to checkout
      default: main
    - name: package
      description: base package
    - name: packages
      description: packages to build/test
      default: "./..."
  tasks:
    - name: fetch-repository
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.url)
        - name: revision
          value: $(params.revision)
        - name: deleteExisting
          value: "true"
    # A single Task composed entirely of StepActions, demonstrating the
    # composable workflow: fmt + vet + build + test as steps.
    - name: go-checks
      runAfter:
        - fetch-repository
      workspaces:
        - name: source
          workspace: shared-workspace
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: fmt
            ref:
              name: golang-fmt
            params:
              - name: source-path
                value: $(workspaces.source.path)
          - name: goimports
            ref:
              name: golang-goimports
            params:
              - name: source-path
                value: $(workspaces.source.path)
          - name: vet
            ref:
              name: golang-vet
            params:
              - name: source-path
                value: $(workspaces.source.path)
              - name: packages
                value: $(params.packages)
          - name: build
            ref:
              name: golang-build
            params:
              - name: source-path
                value: $(workspaces.source.path)
              - name: package
                value: $(params.package)
              - name: packages
                value: $(params.packages)
          - name: test
            ref:
              name: golang-test
            params:
              - name: source-path
                value: $(workspaces.source.path)
              - name: package
                value: $(params.package)
              - name: packages
                value: $(params.packages)
