name: release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    permissions:
      packages: write
      id-token: write
      contents: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: tektoncd/actions/setup-tektoncd-cli@dd92514472167b361de1c95fd31fc2ef83c282ec # main

      - uses: imjasonh/setup-crane@59c71e96a00b28651f10369ba3359a6d730740a0 # v0.6

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set tag output
        id: tag
        run: echo "tag_name=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish Tekton Bundles
        env:
          GIT_TAG: ${{ steps.tag.outputs.tag_name }}
          REGISTRY: "ghcr.io/${{ github.repository }}"
        run: |
          for taskdir in task/golang-*; do
            task=$(basename "${taskdir}")
            echo "--- Publishing bundle for ${task}"
            tkn bundle push "${REGISTRY}/${task}:${GIT_TAG}" \
              -f "${taskdir}/${task}.yaml"
            tkn bundle push "${REGISTRY}/${task}:latest" \
              -f "${taskdir}/${task}.yaml"
          done
          for sadir in stepaction/*/; do
            sa=$(basename "${sadir}")
            [[ -f "${sadir}${sa}.yaml" ]] || continue
            echo "--- Publishing bundle for stepaction-${sa}"
            tkn bundle push "${REGISTRY}/stepaction-${sa}:${GIT_TAG}" \
              -f "${sadir}${sa}.yaml"
            tkn bundle push "${REGISTRY}/stepaction-${sa}:latest" \
              -f "${sadir}${sa}.yaml"
          done

      - name: Sign Tekton Bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TAG: ${{ steps.tag.outputs.tag_name }}
          REGISTRY: "ghcr.io/${{ github.repository }}"
        run: |
          for taskdir in task/golang-*; do
            task=$(basename "${taskdir}")
            echo "--- Signing bundle for ${task}"
            digest=$(crane digest "${REGISTRY}/${task}:${GIT_TAG}")
            cosign sign --yes \
                -a GIT_HASH="${{ github.sha }}" \
                -a GIT_TAG="${GIT_TAG}" \
                "${REGISTRY}/${task}@${digest}"
          done
          for sadir in stepaction/*/; do
            sa=$(basename "${sadir}")
            [[ -f "${sadir}${sa}.yaml" ]] || continue
            echo "--- Signing bundle for stepaction-${sa}"
            digest=$(crane digest "${REGISTRY}/stepaction-${sa}:${GIT_TAG}")
            cosign sign --yes \
                -a GIT_HASH="${{ github.sha }}" \
                -a GIT_TAG="${GIT_TAG}" \
                "${REGISTRY}/stepaction-${sa}@${digest}"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TAG: ${{ steps.tag.outputs.tag_name }}
          REGISTRY: "ghcr.io/${{ github.repository }}"
        run: |
          # Build dynamic install snippet and bundle image list
          INSTALL_LINES=""
          BUNDLE_LINES=""
          for taskdir in task/golang-*; do
            task=$(basename "${taskdir}")
            INSTALL_LINES+="          kubectl apply -f https://raw.githubusercontent.com/${{ github.repository }}/${GIT_TAG}/${taskdir}/${task}.yaml\n"
            BUNDLE_LINES+="          - \`${REGISTRY}/${task}:${GIT_TAG}\`\n"
          done
          for sadir in stepaction/*/; do
            sa=$(basename "${sadir}")
            [[ -f "${sadir}${sa}.yaml" ]] || continue
            BUNDLE_LINES+="          - \`${REGISTRY}/stepaction-${sa}:${GIT_TAG}\`\n"
          done

          cat <<EOF > release-notes.md
          ## Tekton Bundles

          Install tasks directly:
          \`\`\`bash
          $(printf '%b' "${INSTALL_LINES}")
          \`\`\`

          Or use via bundle resolver:
          \`\`\`yaml
          taskRef:
            resolver: bundles
            params:
              - name: bundle
                value: ${REGISTRY}/golang-build:${GIT_TAG}
              - name: name
                value: golang-build
              - name: kind
                value: task
          \`\`\`

          ### Bundle images
          $(printf '%b' "${BUNDLE_LINES}")
          All bundles are signed with [cosign](https://github.com/sigstore/cosign).
          EOF

          gh release create "${GIT_TAG}" \
            --title "${GIT_TAG}" \
            --notes-file release-notes.md
